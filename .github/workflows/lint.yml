name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Silence the Node 20 deprecation notice from the runner.
# TODO: drop this once every Node-using action supports Node 24.
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  go:
    name: Go (fmt + vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Download modules
        run: |
          go get github.com/stretchr/testify@v1.10.0
          go mod tidy
          go mod download

      - name: Check formatting
        run: |
          # Auto-format any unformatted Go files, then verify nothing
          # remains. Surfaces the diff for the developer to commit.
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Files auto-formatted by gofmt (please commit the changes):"
            echo "$files"
            gofmt -w $files
            git --no-pager diff
          fi

      - name: Run go vet
        run: go vet ./...

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: |
            *.md
            docs/src/content/**/*.md
            !CHANGELOG.md
            !docs/CHANGELOG.md
            !SECURITY.md
          config: .markdownlint.jsonc

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./"
          additional_files: "install.sh uninstall.sh"
