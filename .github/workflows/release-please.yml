name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

# TODO: bump Node version once Starlight + Astro 5 fully support Node 24.
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Clean up fulfilled release PR labels"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # release-please may leave the `velo-release: pending` label on a
          # closed release PR after creating the release. On the next run the
          # action re-finds that labeled PR and tries to re-fulfill it, which
          # fails with `Validation Failed: already_exists` because the release
          # already exists. Garbage-collect the label from any closed release
          # PR whose corresponding release is already on GitHub.
          for pr in $(gh pr list --state closed --label "velo-release: pending" --json number --jq '.[].number' 2>/dev/null || true); do
            tag=$(gh pr view "$pr" --json title --jq '.title' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
            if [ -n "$tag" ] && gh release view "$tag" >/dev/null 2>&1; then
              echo "Removing velo-release: pending from PR #${pr} (release ${tag} already exists)"
              gh pr edit "$pr" --remove-label "velo-release: pending" >/dev/null || echo "  label removal failed (non-fatal)"
            fi
          done

  binaries:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: tar.gz
          - os: linux
            arch: arm64
            ext: tar.gz
          - os: darwin
            arch: amd64
            ext: tar.gz
          - os: darwin
            arch: arm64
            ext: tar.gz
          - os: windows
            arch: amd64
            ext: zip
          - os: windows
            arch: arm64
            ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: true

      - name: Download modules
        run: |
          go get github.com/stretchr/testify@v1.10.0
          go mod tidy
          go mod download

      - name: Run tests
        run: go test ./... -race

      - name: Compute version
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT="velo-deploy_${VERSION}_${GOOS}_${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            OUT="${OUT}.exe"
          fi
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${OUT}" \
            ./cmd/velo-deploy

      - name: Package
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ASSET_BASE="velo-deploy_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p staging
          cd staging
          if [ "${GOOS}" = "windows" ]; then
            cp ../"${ASSET_BASE}.exe" velo-deploy.exe
            [ -f ../README.md ] && cp ../README.md .
            [ -f ../LICENSE ] && cp ../LICENSE .
            zip -r "../${ASSET_BASE}.zip" . >/dev/null
          else
            cp ../"${ASSET_BASE}" velo-deploy
            [ -f ../README.md ] && cp ../README.md .
            [ -f ../LICENSE ] && cp ../LICENSE .
            tar -czf "../${ASSET_BASE}.tar.gz" .
          fi
          cd ..

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: velo-deploy-binary-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            velo-deploy_${{ steps.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Build docs site
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: docs
        run: pnpm build

      - name: Zip site
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          cd docs
          zip -r "../velo-deploy-docs-site_${TAG}.zip" dist >/dev/null
          cd ..

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: velo-deploy-docs-site
          path: velo-deploy-docs-site_${{ needs.release-please.outputs.tag_name }}.zip
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach artifacts to release
    needs: [release-please, binaries, docs]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: velo-deploy-binary-*
          path: dist
          merge-multiple: true

      - name: Stage install script
        working-directory: dist
        run: |
          set -euo pipefail
          cp ../install.sh velo-deploy-install.sh
          ls -la

      - name: Download docs site
        uses: actions/download-artifact@v8
        with:
          name: velo-deploy-docs-site
          path: site

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # Only hash archives that were actually produced this run.
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Verify required release assets
        working-directory: dist
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          required=(
            "velo-deploy_${VERSION}_linux_amd64.tar.gz"
            "velo-deploy_${VERSION}_linux_arm64.tar.gz"
            "velo-deploy-install.sh"
          )
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required release asset: $file" >&2
              ls -la
              exit 1
            fi
          done

      - name: Show artifacts
        run: |
          echo '--- dist ---'
          ls -la dist/ 2>/dev/null || echo '(empty)'
          echo '--- site ---'
          ls -la site/ 2>/dev/null || echo '(empty)'

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/*
            site/*
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
