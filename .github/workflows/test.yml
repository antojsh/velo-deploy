name: Tests and Coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: |
          go get github.com/stretchr/testify@v1.10.0
          go mod tidy
          go mod download

      - name: Run tests with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage thresholds
        run: |
          echo "=== Coverage Report ==="
          go tool cover -func=coverage.out

          # Get total coverage
          TOTAL=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"

          MIN_TOTAL=90

          echo ""
          echo "=== Checking Thresholds ==="

          # Check per-package coverage
          for pkg in config hosts caddy node systemd deploy; do
            COVERAGE=$(go tool cover -func=coverage.out | grep "internal/${pkg}" | awk '{print $3}' | tr -d '%' || echo "0")
            echo "internal/${pkg}: ${COVERAGE}%"
          done

          echo ""
          echo "Total coverage: ${TOTAL}%"

          # Fail if total coverage is below threshold
          if (( $(echo "$TOTAL < $MIN_TOTAL" | bc -l) )); then
            echo ""
            echo "ERROR: Total coverage ($TOTAL%) is below minimum threshold ($MIN_TOTAL%)"
            exit 1
          fi

          echo ""
          echo "✓ Coverage threshold met (total ${TOTAL}% >= ${MIN_TOTAL}%)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: success()
        with:
          files: ./coverage.out
          flags: unittests
          name: velo-deploy

      - name: Generate HTML coverage report
        if: always()
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.html
