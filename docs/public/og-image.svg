<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Velo Deploy documentation</title>
  <desc id="desc">Bare metal PaaS documentation for Node.js and static sites on a VPS without Docker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="148" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.58" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.30 0 0 0 0 0.18 0 0 0 0 0.90 0 0 0 0.65 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94A3B8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="188" cy="118" r="230" fill="#7C3AED" opacity="0.24"/>
  <circle cx="1030" cy="108" r="240" fill="#2563EB" opacity="0.20"/>
  <circle cx="650" cy="610" r="260" fill="#22D3EE" opacity="0.10"/>
  <rect x="80" y="92" width="1040" height="446" rx="38" fill="#0F172A" fill-opacity="0.72" stroke="#94A3B8" stroke-opacity="0.24"/>
  <rect x="118" y="134" width="148" height="148" rx="34" fill="url(#mark)" filter="url(#glow)"/>
  <path d="M154 188 L192 246 L230 188 M168 188 L192 222 L216 188" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="304" y="184" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#A5B4FC" letter-spacing="1.5">VELO DEPLOY DOCS</text>
  <text x="304" y="272" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="#F8FAFC" letter-spacing="-3">Ship Node.js like</text>
  <text x="304" y="354" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="#F8FAFC" letter-spacing="-3">a Linux service</text>
  <text x="304" y="424" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="31" font-weight="500" fill="#CBD5E1">Bare Metal PaaS · systemd · Caddy HTTPS · no Docker daemon</text>
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="700">
    <rect x="304" y="462" width="132" height="42" rx="21" fill="#22C55E" fill-opacity="0.16" stroke="#22C55E" stroke-opacity="0.48"/>
    <text x="328" y="490" fill="#86EFAC">systemd</text>
    <rect x="452" y="462" width="104" height="42" rx="21" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.42"/>
    <text x="476" y="490" fill="#7DD3FC">Caddy</text>
    <rect x="572" y="462" width="174" height="42" rx="21" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.42"/>
    <text x="596" y="490" fill="#C4B5FD">Linux users</text>
  </g>
</svg>
